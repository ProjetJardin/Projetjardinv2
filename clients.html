<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients — Administration Projet Jardin</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="mise-en-page-admin">
    <aside class="menu-lateral" id="menu-lateral"></aside>

    <div class="contenu-admin">
      <div class="entete-page">
        <div>
          <h1>Clients</h1>
          <p class="sous-titre">Toutes les personnes et entreprises pour qui tu travailles.</p>
        </div>
        <button class="bouton bouton-principal" id="bouton-nouveau-client">+ Nouveau client</button>
      </div>

      <div class="barre-outils">
        <input type="search" id="recherche-clients" placeholder="Rechercher un nom, une entreprise, un email…">
        <button type="button" class="chip-filtre" id="bouton-afficher-archives" aria-pressed="false">Afficher les clients archivés</button>
      </div>

      <div id="zone-tableau-clients"><div class="chargement">Chargement des clients…</div></div>
    </div>
  </div>

  <!-- Panneau : création / modification d'un client -->
  <div class="fond-panneau" id="panneau-client-fond">
    <div class="panneau-lateral">
      <div class="entete-panneau">
        <h2 id="titre-panneau-client">Nouveau client</h2>
        <button class="bouton-fermer" id="fermer-panneau-client" aria-label="Fermer">✕</button>
      </div>
      <form id="formulaire-client" class="formulaire-admin">
        <input type="hidden" id="client-id">
        <div class="ligne-formulaire">
          <div class="champ">
            <label for="client-nom">Nom</label>
            <input type="text" id="client-nom">
          </div>
          <div class="champ">
            <label for="client-prenom">Prénom</label>
            <input type="text" id="client-prenom">
          </div>
        </div>
        <div class="champ">
          <label for="client-entreprise">Entreprise <span class="aide">(si le client est une société)</span></label>
          <input type="text" id="client-entreprise">
        </div>
        <p class="erreur-champ" id="erreur-client-nom"></p>
        <div class="champ">
          <label for="client-adresse">Adresse</label>
          <input type="text" id="client-adresse">
        </div>
        <div class="champ">
          <label for="client-complement">Complément d'adresse</label>
          <input type="text" id="client-complement">
        </div>
        <div class="ligne-formulaire">
          <div class="champ">
            <label for="client-code-postal">Code postal</label>
            <input type="text" id="client-code-postal">
          </div>
          <div class="champ">
            <label for="client-ville">Ville</label>
            <input type="text" id="client-ville">
          </div>
        </div>
        <div class="ligne-formulaire">
          <div class="champ">
            <label for="client-telephone">Téléphone</label>
            <input type="tel" id="client-telephone">
          </div>
          <div class="champ">
            <label for="client-email">Email</label>
            <input type="email" id="client-email">
          </div>
        </div>
        <div class="champ">
          <label for="client-notes">Notes internes</label>
          <textarea id="client-notes" rows="3"></textarea>
        </div>

        <div class="actions-panneau">
          <button type="submit" class="bouton bouton-principal" id="bouton-enregistrer-client">Enregistrer</button>
          <button type="button" class="bouton bouton-secondaire" id="annuler-panneau-client">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Panneau : consultation d'un client + historique -->
  <div class="fond-panneau" id="panneau-vue-client-fond">
    <div class="panneau-lateral">
      <div class="entete-panneau">
        <h2 id="titre-vue-client">Client</h2>
        <button class="bouton-fermer" id="fermer-panneau-vue-client" aria-label="Fermer">✕</button>
      </div>
      <div id="contenu-vue-client"></div>
    </div>
  </div>

  <script type="module" src="../js/clients.js"></script>
</body>
</html>
